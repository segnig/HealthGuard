<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthGuard Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header>
      <div class="header-brand">
        <img src="../icons/icon32.png" alt="" width="32" height="32" class="app-icon" />
        <div>
          <h1>HealthGuard</h1>
          <p class="header-subtitle">Settings &amp; analytics</p>
        </div>
      </div>
      <div id="save-status" class="save-status">✓ All saved</div>
    </header>

    <nav class="tab-nav">
      <button type="button" class="tab-btn active" data-tab="settings">Settings</button>
      <button type="button" class="tab-btn" data-tab="weekly">Weekly report</button>
      <button type="button" class="tab-btn" data-tab="sound">Sound history</button>
      <button type="button" class="tab-btn" data-tab="export">Data export</button>
    </nav>

    <main>
      <section id="tab-settings" class="tab-panel active">
        <div class="settings-grid">
          <article class="settings-card">
            <h2>Screen time</h2>
            <div class="field-row">
              <label for="daily-limit-hours">Daily limit</label>
              <div class="inline-input">
                <input type="number" id="daily-limit-hours" min="0.5" step="0.5" />
                <span>hours</span>
              </div>
            </div>
            <div class="field-row">
              <label for="break-interval">Break every</label>
              <div class="slider-row">
                <input type="range" id="break-interval" min="5" max="60" step="1" />
                <span id="break-interval-value">20 min</span>
              </div>
            </div>
            <div class="field-row">
              <label for="break-duration">Break duration</label>
              <div class="slider-row">
                <input type="range" id="break-duration" min="10" max="60" step="5" />
                <span id="break-duration-value">20 sec</span>
              </div>
            </div>
            <div class="field-row">
              <label for="action-on-limit">When limit is hit</label>
              <select id="action-on-limit">
                <option value="notify">Notify only</option>
                <option value="overlay">Show overlay</option>
                <option value="block">Block page</option>
              </select>
            </div>
          </article>

          <article class="settings-card">
            <h2>Sound protection</h2>
            <div class="field-row">
              <label for="max-db">Volume ceiling</label>
              <div class="slider-row">
                <input type="range" id="max-db" min="60" max="100" step="1" />
                <span id="max-db-value">85 dB</span>
              </div>
            </div>
            <div class="field-row">
              <label for="hearing-warn">Budget warning at</label>
              <div class="slider-row">
                <input type="range" id="hearing-warn" min="50" max="100" step="1" />
                <span id="hearing-warn-value">80%</span>
              </div>
            </div>
          </article>

          <article class="settings-card">
            <h2>Schedule</h2>
            <div class="field-row">
              <label>Active hours</label>
              <div class="time-range">
                <input type="time" id="schedule-start" />
                <span>to</span>
                <input type="time" id="schedule-end" />
              </div>
            </div>
            <div class="field-row">
              <label for="blue-light-time">Blue light warning</label>
              <input type="time" id="blue-light-time" />
            </div>
          </article>

          <article class="settings-card">
            <h2>Reminders</h2>
            <div class="toggle-row">
              <span>Posture check (30 min)</span>
              <label class="toggle">
                <input type="checkbox" id="posture-enabled" />
                <span class="toggle-track"></span>
              </label>
            </div>
            <div class="toggle-row">
              <span>Hydration nudge (60 min)</span>
              <label class="toggle">
                <input type="checkbox" id="hydrate-enabled" />
                <span class="toggle-track"></span>
              </label>
            </div>
            <div class="toggle-row">
              <span>Daily health score at 9pm</span>
              <label class="toggle">
                <input type="checkbox" id="summary-enabled" />
                <span class="toggle-track"></span>
              </label>
            </div>
            <div class="toggle-row">
              <span>Auto-export weekly data</span>
              <label class="toggle">
                <input type="checkbox" id="auto-export" />
                <span class="toggle-track"></span>
              </label>
            </div>
          </article>
        </div>
      </section>

      <section id="tab-weekly" class="tab-panel">
        <canvas id="chart-weekly" width="720" height="320"></canvas>
      </section>

      <section id="tab-sound" class="tab-panel">
        <canvas id="chart-sound" width="720" height="320"></canvas>
        <div id="heatmap"></div>
      </section>

      <section id="tab-export" class="tab-panel export-panel">
        <button type="button" id="btn-export-json">Export JSON</button>
        <button type="button" id="btn-export-csv">Export CSV</button>
        <button type="button" id="btn-reset">Reset today</button>
      </section>
    </main>

    <script src="options.js" type="module"></script>
  </body>
</html>
